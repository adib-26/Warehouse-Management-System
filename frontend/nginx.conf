# Slow down password guessing: each client address may send a burst of 20
# sign-in attempts, then one every 3 seconds; extra attempts get HTTP 429. If
# another reverse proxy sits in front of this one, configure set_real_ip_from
# and real_ip_header so the limit applies per client, not per proxy.
limit_req_zone $binary_remote_addr zone=login:10m rate=20r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size ${MAX_UPLOAD_BYTES};

    include /etc/nginx/includes/security-headers.conf;

    # Forecast evaluation can legitimately take longer than Nginx's one-minute
    # default. Keep the frontend responsive while allowing bounded runs to
    # complete through the same-origin proxy.
    proxy_connect_timeout 5s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css;

    location = /v1 {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8000/v1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/auth/login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8000/v1/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the documented compatibility API available from the same origin as
    # the SPA. Without this proxy, /api/forecast requests fall through to
    # index.html in production deployments.
    location = /api {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        # Any add_header here replaces the server-level headers, so include
        # the security headers again.
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
