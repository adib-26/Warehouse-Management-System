    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

         avoids a white flash before CSS loads. theme-init.js may pin one. -->

    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#171614" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e8e5de" media="(prefers-color-scheme: light)" />
    <meta name="description" content="NovaLedger — warehouse management, inventory, and demand forecasting." />
    <title>NovaLedger — Warehouse Management</title>
  </head>
