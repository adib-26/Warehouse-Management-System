add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
# React writes presentation styles inline, and the bundled stylesheet keeps a few
# <style> blocks, so style-src keeps 'unsafe-inline'. Fonts are now self-hosted
# through Fontsource and bundled as same-origin /assets/*.woff2 files, so no
# external font or stylesheet origins are needed. Scripts, frames, plugins, and
# form targets stay same-origin. `connect-src https:` preserves the documented
# option of hosting the API on a separate HTTPS origin through VITE_API_URL.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
