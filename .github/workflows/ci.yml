name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: novaledger_test
          MYSQL_USER: novaledger
          MYSQL_PASSWORD: novaledger
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://novaledger:novaledger@127.0.0.1:3306/novaledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip check
      - run: python -m compileall -q .
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  container-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: 0123456789abcdef0123456789abcdef
      INITIAL_ADMIN_PASSWORD: CorrectHorseBatteryStaple
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_PASSWORD: ci-app-password
      BACKEND_PORT: 18000
      FRONTEND_PORT: 15173
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p novaledger-ci up --build -d --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://localhost:15173/health
      - run: docker compose -p novaledger-ci exec -T --user 10001:10001 backend sh -c 'test -w /data && test -w /data/uploads && test ! -w /app'
      - if: always()
        run: docker compose -p novaledger-ci down -v --remove-orphans
